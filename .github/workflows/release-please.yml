name: "Release: release-please"

# release-please opens and updates the release PR from conventional commits on
# main. Merging that PR tags vX.Y.Z and creates the GitHub release; the
# upload-assets job then attaches module.json and the module zip, so Foundry
# can install by the manifest URL
#   https://github.com/laurigates/foundryvtt-local-rest-api/releases/latest/download/module.json
#
# Needs the release-please App credentials that laurigates/gitops pushes to
# repos with release_please = true (RELEASE_PLEASE_CLIENT_ID variable,
# RELEASE_PLEASE_PRIVATE_KEY secret). Until gitops#442 is merged and applied,
# the App token step fails for want of them.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# Queue rather than cancel: a cancelled run could skip a release's asset upload
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: laurigates/.github/.github/workflows/reusable-release-please.yml@main
    with:
      app-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
      missed-release-check: error
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

  upload-assets:
    name: Attach module.json and zip
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x

      # build.js uses only Node built-ins, so no npm install is needed.
      # GITHUB_REPOSITORY (set by Actions) fills the manifest/download URLs.
      - name: Build module.json and the module zip
        id: package
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: .github/scripts/package-module.sh

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          ZIP: ${{ steps.package.outputs.zip_name }}
        run: gh release upload "$TAG" module.json "$ZIP" --clobber
