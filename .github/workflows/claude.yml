name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@8a29bc6f0ae11a363721054b6739feba6adabe57 # v1.0.273
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model opus --effort high"
          plugin_marketplaces: |
            https://github.com/laurigates/claude-plugins.git
          # suffix matches marketplace `name` in marketplace.json (same value as the settings.json extraKnownMarketplaces key)
          plugins: |
            configure-plugin@laurigates-claude-plugins
            health-plugin@laurigates-claude-plugins
            hooks-plugin@laurigates-claude-plugins
            git-plugin@laurigates-claude-plugins
            testing-plugin@laurigates-claude-plugins
            code-quality-plugin@laurigates-claude-plugins
            typescript-plugin@laurigates-claude-plugins
            container-plugin@laurigates-claude-plugins
            github-actions-plugin@laurigates-claude-plugins
            foundryvtt-plugin@laurigates-claude-plugins
