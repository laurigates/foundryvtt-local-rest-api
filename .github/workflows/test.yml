name: Test Suite

on:
  push:
    branches: [ main ]
  # Every PR, including stacked PRs whose base is not main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-module:
    name: Test FoundryVTT Module
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
      
      - name: Generate coverage report
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage/lcov.info
          flags: module
          name: module-coverage
          fail_ci_if_error: false

  test-bridge:
    name: Test Bridge Server
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: bridge-server/package-lock.json
      
      - name: Install dependencies
        working-directory: ./bridge-server
        run: npm ci
      
      - name: Run unit tests
        working-directory: ./bridge-server
        run: npm run test:unit
      
      - name: Run contract tests
        working-directory: ./bridge-server
        run: npm run test:contracts
      
      - name: Run integration tests
        working-directory: ./bridge-server
        run: npm run test:integration
      
      - name: Generate coverage report
        working-directory: ./bridge-server
        run: npm run test:coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./bridge-server/coverage/lcov.info
          flags: bridge
          name: bridge-coverage
          fail_ci_if_error: false

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [test-module, test-bridge]
    # Needs foundryvtt.com credentials and a module install step that does not
    # exist yet (see the placeholder below), so it runs only on manual dispatch
    # and is skipped on pushes and PRs.
    if: github.event_name == 'workflow_dispatch'
    
    services:
      foundry:
        image: felddy/foundryvtt:release
        env:
          FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
          FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
          FOUNDRY_ADMIN_KEY: test-admin-key
        ports:
          - 30000:30000
        options: >-
          --health-cmd "curl -f http://localhost:30000 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: 'npm'
      
      - name: Install module dependencies
        run: npm ci
      
      - name: Install bridge dependencies
        working-directory: ./bridge-server
        run: npm ci
      
      - name: Wait for FoundryVTT to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:30000; then
              echo "FoundryVTT is ready"
              break
            fi
            echo "Waiting for FoundryVTT... ($i/30)"
            sleep 2
          done
      
      - name: Install module in FoundryVTT
        run: |
          # This would typically be done via FoundryVTT's API or by copying files
          echo "Module installation would happen here"
      
      - name: Start bridge server
        working-directory: ./bridge-server
        run: |
          npm start &
          sleep 5
        env:
          API_KEY: test-api-key-e2e
          FOUNDRY_URL: http://localhost:30000
      
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          API_KEY: test-api-key-e2e
          FOUNDRY_URL: http://localhost:30000
          BRIDGE_URL: http://localhost:3030

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npx eslint scripts bridge-server

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Run npm audit in bridge server
        working-directory: ./bridge-server
        run: npm audit --audit-level=moderate
        continue-on-error: true

  build:
    name: Build Module
    runs-on: ubuntu-latest
    needs: [test-module, test-bridge, lint]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build module.json
        run: npm run build
      
      - name: Verify module.json
        run: |
          if [ ! -f module.json ]; then
            echo "module.json was not created"
            exit 1
          fi
          cat module.json | jq '.'
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: module-build
          path: |
            module.json
            scripts/
            lang/
            templates/
            bridge-server/
            !bridge-server/node_modules/
            !**/tests/
            !**/*.test.js